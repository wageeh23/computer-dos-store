<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06061a" />
    <meta name="description" content="Computer DOS Store — PC parts, accessories, smart PC builder, streamer setups and AI previews" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Computer DOS Store</title>
    <script>
      (function () {
        try {
          var th = localStorage.getItem('dos_theme') || 'dark';
          var lg = localStorage.getItem('dos_lang') || 'ar';
          document.documentElement.classList.toggle('dark', th === 'dark');
          document.documentElement.lang = lg;
          document.documentElement.dir = lg === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/store/main.jsx"></script>
  </body>
</html>
